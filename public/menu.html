<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#f5f7f4">
	<title>Restaurant Menu</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #1f3029;
			--muted: #68766e;
			--line: #dce4dd;
			--paper: #fff;
			--canvas: #f4f7f3;
			--green: #245b43;
			--green-soft: #e8f0e9;
			--accent: #bd6545;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			background:
				radial-gradient(ellipse at 8% 0%, rgba(210, 228, 213, 0.48), transparent 34rem),
				var(--canvas);
			color: var(--ink);
			font-family: Georgia, "Times New Roman", serif;
		}

		.page-shell {
			width: min(100% - 40px, 1000px);
			margin: 0 auto;
			padding: 30px 0 64px;
		}

		.topline {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 16px;
			padding-bottom: 14px;
			border-bottom: 1px solid var(--line);
			color: var(--green);
			font-family: "Segoe UI", sans-serif;
			font-size: 12px;
			font-weight: 700;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		.topline-mark {
			display: inline-flex;
			align-items: center;
			gap: 9px;
		}

		.topline-mark::before {
			width: 9px;
			height: 9px;
			border-radius: 50%;
			background: var(--accent);
			content: "";
		}

		.menu-hero {
			display: grid;
			grid-template-columns: minmax(0, 1fr) minmax(260px, 0.72fr);
			min-height: 285px;
			margin: 28px 0 42px;
			overflow: hidden;
			border-radius: 7px;
			background: var(--green);
			color: #fff;
		}

		.hero-copy {
			align-self: center;
			padding: 42px clamp(24px, 5vw, 58px);
		}

		.eyebrow {
			margin: 0 0 14px;
			color: #c8ddcd;
			font-family: "Segoe UI", sans-serif;
			font-size: 12px;
			font-weight: 700;
			letter-spacing: 0.14em;
			text-transform: uppercase;
		}

		h1 {
			max-width: 620px;
			margin: 0;
			font-size: clamp(34px, 5vw, 54px);
			font-weight: 500;
			line-height: 1.08;
			overflow-wrap: anywhere;
		}

		.currency-note {
			margin: 20px 0 0;
			color: #e2ede4;
			font-family: "Segoe UI", sans-serif;
			font-size: 14px;
		}

		.hero-image {
			width: 100%;
			height: 100%;
			min-height: 285px;
			object-fit: cover;
			object-position: center;
		}

		.menu-content {
			max-width: 760px;
			margin: 0 auto;
		}

		.menu-intro {
			display: flex;
			align-items: baseline;
			justify-content: space-between;
			gap: 18px;
			margin-bottom: 28px;
			padding-bottom: 14px;
			border-bottom: 1px solid var(--line);
			font-family: "Segoe UI", sans-serif;
		}

		.menu-intro h2 {
			margin: 0;
			font-family: Georgia, "Times New Roman", serif;
			font-size: 24px;
			font-weight: 500;
		}

		.menu-intro span {
			color: var(--muted);
			font-size: 13px;
		}

		.category-list {
			display: grid;
			gap: 34px;
		}

		.category-heading {
			display: flex;
			align-items: center;
			gap: 14px;
			margin: 0 0 8px;
			color: var(--green);
			font-size: 22px;
			font-weight: 500;
			letter-spacing: 0.035em;
		}

		.category-heading::after {
			height: 1px;
			flex: 1;
			background: var(--line);
			content: "";
		}

		.menu-item {
			display: grid;
			grid-template-columns: minmax(0, 1fr) auto;
			gap: 6px 20px;
			padding: 18px 0;
			border-bottom: 1px solid #e6ebe6;
		}

		.item-name {
			margin: 0;
			font-size: 19px;
			font-weight: 600;
			line-height: 1.3;
		}

		.item-price {
			align-self: start;
			color: var(--green);
			font-family: "Segoe UI", sans-serif;
			font-size: 16px;
			font-weight: 700;
			white-space: nowrap;
		}

		.item-description {
			grid-column: 1;
			margin: 0;
			color: var(--muted);
			font-family: "Segoe UI", sans-serif;
			font-size: 14px;
			line-height: 1.6;
		}

		.state-message {
			margin: 26px 0;
			padding: 22px;
			border-left: 3px solid var(--accent);
			background: var(--paper);
			color: var(--muted);
			font-family: "Segoe UI", sans-serif;
			line-height: 1.55;
		}

		.state-message[hidden] {
			display: none;
		}

		.menu-footer {
			margin-top: 46px;
			padding-top: 18px;
			border-top: 1px solid var(--line);
			color: var(--muted);
			font-family: "Segoe UI", sans-serif;
			font-size: 12px;
			text-align: center;
		}

		@media (max-width: 640px) {
			.page-shell {
				width: min(100% - 28px, 1000px);
				padding-top: 18px;
			}

			.menu-hero {
				grid-template-columns: 1fr;
				margin: 20px 0 32px;
			}

			.hero-copy {
				padding: 30px 24px 26px;
			}

			h1 {
				font-size: 38px;
			}

			.hero-image {
				height: 170px;
				min-height: 170px;
			}

			.menu-intro {
				align-items: flex-start;
				flex-direction: column;
				gap: 5px;
				margin-bottom: 22px;
			}

			.category-list {
				gap: 28px;
			}

			.menu-item {
				gap: 6px 12px;
			}

			.item-name {
				font-size: 17px;
			}
		}
	</style>
</head>
<body>
	<main class="page-shell">
		<div class="topline">
			<span class="topline-mark">The Menu</span>
			<span id="menuStatus">Loading menu</span>
		</div>

		<header class="menu-hero">
			<div class="hero-copy">
				<p class="eyebrow">Kitchen &amp; bar</p>
				<h1 id="menuName">Loading menu...</h1>
				<p id="currencyNote" class="currency-note"></p>
			</div>
			<img
				class="hero-image"
				src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&amp;fit=crop&amp;w=1100&amp;q=85"
				alt="A freshly prepared seasonal dish"
				onerror="this.hidden = true"
			>
		</header>

		<section class="menu-content" aria-labelledby="menuSectionTitle">
			<div class="menu-intro">
				<h2 id="menuSectionTitle">Our menu</h2>
				<span>Freshly prepared, thoughtfully served</span>
			</div>
			<div id="pageMessage" class="state-message" role="status" aria-live="polite">Loading the menu. Please wait...</div>
			<div id="categoryList" class="category-list"></div>
		</section>

		<footer class="menu-footer">Please let our team know about any dietary requirements.</footer>
	</main>

	<script src="/js/menu.js"></script>
</body>
</html>
